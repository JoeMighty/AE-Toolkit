<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoeMighty | AE Toolkit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#050505',
                        surface: '#111111',
                        surfaceBorder: '#222222',
                        accent1: '#6366f1', // Indigo
                        accent2: '#a855f7', // Purple
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #ededed; }
        
        /* Premium Background Grid */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        }

        /* Ambient Glow Orbs */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
        }

        /* Card Hover Effects */
        .tool-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.15);
            border-color: rgba(168, 85, 247, 0.4);
        }
        .tool-card .arrow-icon {
            transition: transform 0.3s ease;
        }
        .tool-card:hover .arrow-icon {
            transform: translateX(4px);
        }
    </style>
</head>
<body class="relative min-h-screen flex flex-col font-sans antialiased overflow-x-hidden selection:bg-accent2 selection:text-white">

    <!-- Ambient Background Elements -->
    <div class="fixed inset-0 bg-grid z-[-2] pointer-events-none"></div>
    <div class="glow-orb bg-accent1 w-[500px] h-[500px] top-[-100px] left-[-100px]"></div>
    <div class="glow-orb bg-accent2 w-[600px] h-[600px] top-[20%] right-[-200px]"></div>

    <!-- Header / Hero Section -->
    <header class="relative pt-32 pb-20 text-center px-4">
        <div class="inline-block mb-4 px-4 py-1.5 rounded-full border border-surfaceBorder bg-surface/50 backdrop-blur-md text-sm font-medium text-gray-300">
            Open Source v1.0
        </div>
        <h1 class="text-5xl md:text-7xl font-bold tracking-tight mb-6">
            Accelerate your <br />
            <span class="bg-clip-text text-transparent bg-gradient-to-r from-accent1 to-accent2">Motion Workflow</span>
        </h1>
        <p class="text-lg md:text-xl text-gray-400 max-w-2xl mx-auto font-light leading-relaxed">
            A premium collection of open source ScriptUI panels and utilities designed to eliminate tedious tasks in Adobe After Effects.
        </p>
        <div class="mt-10 flex flex-col sm:flex-row justify-center items-center gap-4">
            <a href="https://github.com/JoeMighty/AE-Toolkit" target="_blank" class="group relative px-8 py-4 bg-white text-black font-semibold rounded-lg overflow-hidden transition-transform active:scale-95">
                <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-gray-200 to-white opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <span class="relative flex items-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path></svg>
                    View Repository
                </span>
            </a>
            <a href="#tools" class="px-8 py-4 text-gray-300 font-medium hover:text-white transition-colors">
                Explore Tools ↓
            </a>
        </div>
    </header>

    <!-- Main Content (Tools Grid) -->
    <main id="tools" class="flex-grow container mx-auto px-4 py-16 max-w-7xl relative z-10">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="tool-grid">
            
            <!-- Tool Cards injected via JS -->
            <script>
                const repoBaseUrl = "https://github.com/JoeMighty/AE-Toolkit/blob/main/";
                
                const tools = [
                    { title: "Slideshow Builder", file: "SlideshowBuilder.jsx", desc: "Instantly arranges layers into a sequential slideshow with custom durations, fades, and complex transitions." },
                    { title: "Project Organizer", file: "ProjectOrganizer.jsx", desc: "Scans the project bin and automatically files items into neat folders based on their file type extensions." },
                    { title: "Expression Injector", file: "ExpressionInjector.jsx", desc: "A quick panel to inject common expressions (Wiggle, Loop, Bounce) into selected properties instantly." },
                    { title: "Layer Randomizer", file: "LayerRandomizer.jsx", desc: "Randomly shifts the start times of selected layers to create beautiful, organic, staggered animations." },
                    { title: "Auto Text Box", file: "AutoTextBox.jsx", desc: "Creates a dynamic shape layer that perfectly wraps behind selected text and resizes automatically." },
                    { title: "Text Splitter", file: "TextSplitter.jsx", desc: "Duplicates a single paragraph text layer into separate individual layers based on words or lines." },
                    { title: "Subtitle Importer", file: "SubtitleImporter.jsx", desc: "Reads standard .srt files and generates text layers perfectly synced to your timeline." },
                    { title: "Anchor Point Manager", file: "AnchorManager.jsx", desc: "Snaps layer anchor points to 9 different sectors without moving the layer's visual world position." },
                    { title: "Master Color Control", file: "MasterColorController.jsx", desc: "Links all colors in selected layers to a single Master Null for incredibly easy, global color changes." },
                    { title: "Palette Extractor", file: "PaletteExtractor.jsx", desc: "Reads colors directly from an image layer and generates a clean 5-color solid shape palette." },
                    { title: "Expression Baker", file: "ExpressionBaker.jsx", desc: "Finds every property running an expression across selected layers and bakes them into standard keyframes." },
                    { title: "Advanced Sequencer", file: "AdvancedSequencer.jsx", desc: "Staggers or sequences layers back-to-back with precise frame offsets and ordering controls." }
                ];

                const container = document.getElementById('tool-grid');
                
                tools.forEach(tool => {
                    const cardLink = document.createElement('a');
                    cardLink.href = repoBaseUrl + tool.file;
                    cardLink.target = "_blank";
                    cardLink.className = "tool-card group relative flex flex-col justify-between h-full bg-surface/40 backdrop-blur-md border border-surfaceBorder rounded-2xl p-8 overflow-hidden";
                    
                    cardLink.innerHTML = `
                        <div class="absolute inset-0 bg-gradient-to-b from-white/[0.02] to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        
                        <div class="relative z-10">
                            <div class="flex justify-between items-start mb-4">
                                <h3 class="text-xl font-semibold text-white tracking-tight">${tool.title}</h3>
                                <svg class="arrow-icon w-5 h-5 text-gray-500 group-hover:text-accent2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </div>
                            <p class="text-gray-400 text-sm leading-relaxed mb-6 font-light">${tool.desc}</p>
                        </div>
                        
                        <div class="relative z-10 flex items-center justify-between mt-auto pt-4 border-t border-surfaceBorder/50">
                            <span class="text-xs font-mono text-gray-500 bg-black/50 px-2 py-1 rounded">${tool.file}</span>
                            <span class="text-sm font-medium text-accent1 group-hover:text-accent2 transition-colors">Get Script</span>
                        </div>
                    `;
                    container.appendChild(cardLink);
                });
            </script>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-surfaceBorder bg-background/80 backdrop-blur-lg py-10 mt-auto text-center relative z-10">
        <p class="text-gray-500 text-sm">
            Created and maintained by <a href="https://github.com/JoeMighty" target="_blank" class="text-gray-300 hover:text-white hover:underline transition-colors font-medium">JoeMighty</a>.
        </p>
        <p class="text-gray-600 text-xs mt-2">Released under the MIT License.</p>
    </footer>

</body>
</html>
